<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Arradius</title>
    <meta name="description" content="Politics. Economy. Warfare. Story-driven strategy on a rock world at the edge of empire." />
    <meta property="og:title" content="Arradius" />
    <meta property="og:description" content="Politics. Economy. Warfare. Story-driven strategy on a rock world at the edge of empire." />
    <meta property="og:image" content="https://arradius.pages.dev/Arradius_OG.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arradius.pages.dev" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arradius" />
    <meta name="twitter:description" content="Politics. Economy. Warfare. A spice-opera strategy game." />
    <meta name="twitter:image" content="https://arradius.pages.dev/Arradius_OG.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Matches the game's darkest tone so FIT letterbox bars are invisible. */
        background: #08060f;
        color: #e6e6f0;
        font-family: system-ui, sans-serif;
        height: 100%;
        overflow: hidden;
        /* Stop the browser from hijacking touches for scroll/zoom/select. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
