<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Platformer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1d1d2b;
        color: #e6e6f0;

      #game {

  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
